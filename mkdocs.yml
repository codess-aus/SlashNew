      - "02 · Rule Zero": chapters/02-rulezero.md
      - "03 · The Right Way": chapters/03-therightway.md
      - "04 · Earning Trust": chapters/04-trust.md
      - "05 · The Moment": chapters/05-themoment.md
      - "06 · It's a Feature, Not a Bug": chapters/06-feature.md
      - "07 · Human in the Loop": chapters/07-hitl.md
      - "08 · Amplify, Don't Replace": chapters/08-amplify.md
      - "09 · Meaningful Oversight": chapters/09-oversight.md
      - "10 · Decision Making with AI": chapters/10-dm.md
      - "11 · Principles That Hold": chapters/11-principles.md
      - "12 · Explainability": chapters/12-explainability.md
      - "13 · Reliability & Safety": chapters/13-reliability.md
      - "14 · Inclusivity by Design": chapters/14-inclusivity.md
      - "15 · Real-World Stories": chapters/15-realworld.md
      - "16 · The Three Waves": chapters/16-3waves.md
      - "17 · Governance": chapters/17-governance.md
      - "18 · Leading with Empathy": chapters/18-empathy.md
