site_name: Scaling Guacamole
site_description: Responsible Agentic AI — a SlashNew Conf 2026 talk by @Codess-Aus
site_author: "@Codess-Aus"
site_url: https://codess-aus.github.io/SlashNew/
repo_url: https://github.com/codess-aus/SlashNew
repo_name: codess-aus/SlashNew
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false        # we load Mona Sans / Calibri ourselves in extra.css
  favicon: assets/0-title.png
  logo: assets/0-title.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: slashnew-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slashnew-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/codess-aus
  generator: false

copyright: Copyright &copy; 2026 @Codess-Aus — SlashNew Conf

